<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body{{ if .IsHome }} class="home"{{ end }}>
    {{ partial "header.html" . }}
    <main{{ if not .IsHome }} class="page"{{ end }}>
      {{ block "main" . }}{{ end }}
    </main>
    {{ if not .IsHome }}{{ partial "footer.html" . }}{{ end }}
    <script src="{{ "js/menu.js" | relURL }}" defer></script>
  </body>
</html>
