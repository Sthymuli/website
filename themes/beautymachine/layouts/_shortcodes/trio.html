{{/*
  Three overlapping thin circles, labelled — the Beauty & the Machine diagram.
  {{< trio a="Robotics" b="Aesthetics" c="Education" center="BM" >}}
*/}}
<figure class="trio" role="img" aria-label="{{ .Get "a" }}, {{ .Get "b" }}, {{ .Get "c" }}">
  <svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <circle cx="110" cy="105" r="85"/>
      <circle cx="210" cy="105" r="85"/>
      <circle cx="160" cy="192" r="85"/>
    </g>
    <g fill="currentColor" font-size="11" text-anchor="middle" letter-spacing="1.5">
      <text x="82" y="90">{{ .Get "a" | upper }}</text>
      <text x="238" y="90">{{ .Get "b" | upper }}</text>
      <text x="160" y="245">{{ .Get "c" | upper }}</text>
      {{ with .Get "center" }}<text x="160" y="140" font-size="10">{{ . | upper }}</text>{{ end }}
    </g>
  </svg>
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
